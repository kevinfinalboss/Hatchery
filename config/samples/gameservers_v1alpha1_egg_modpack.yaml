apiVersion: gameservers.hatchery.io/v1alpha1
kind: Egg
metadata:
  labels:
    app.kubernetes.io/name: hatchery
    app.kubernetes.io/managed-by: kustomize
    gameservers.hatchery.io/modpack-egg: "true"
  name: minecraft-modpack
  namespace: hatchery-catalog
spec:
  images:
    - name: "Java 25"
      image: itzg/minecraft-server:java25
    - name: "Java 21"
      image: itzg/minecraft-server:java21
    - name: "Java 17"
      image: itzg/minecraft-server:java17
    - name: "Java 8"
      image: itzg/minecraft-server:java8
  startCommand: "bash -c 'if [ \"$HATCHERY_PACK_SOURCE\" = curseforge ]; then export TYPE=AUTO_CURSEFORGE CF_SLUG=\"$HATCHERY_PACK\" CF_FILE_ID=\"$HATCHERY_PACK_VERSION\"; else export TYPE=MODRINTH MODRINTH_MODPACK=\"$HATCHERY_PACK\" MODRINTH_VERSION=\"$HATCHERY_PACK_VERSION\"; fi; exec /image/scripts/start'"
  stopTimeoutSeconds: 120
  stopSignal: SIGTERM
  startupDetection:
    regex: "\\)! For help, type "
    timeoutSeconds: 1800
  recommendedResources:
    cpu: "2"
    memory: 6Gi
    disk: 15Gi
  variables:
    - name: EULA
      description: "Aceita a EULA da Mojang (https://aka.ms/MinecraftEULA). Obrigatório pro servidor iniciar."
      default: "TRUE"
      required: true
      userEditable: true
    - name: HATCHERY_PACK_SOURCE
      description: "De onde vem o modpack: modrinth ou curseforge."
      default: "modrinth"
      required: true
      userEditable: true
      validationRegex: "^(modrinth|curseforge)$"
    - name: HATCHERY_PACK
      description: "Modpack: no Modrinth, o ID do projeto; na CurseForge, o slug."
      default: ""
      required: true
      userEditable: true
      validationRegex: "^[A-Za-z0-9._-]{1,100}$"
    - name: HATCHERY_PACK_PROJECT_ID
      description: "ID do projeto na fonte, usado pelo painel para listar versões (na CurseForge é numérico; no Modrinth é o mesmo de HATCHERY_PACK)."
      default: ""
      userEditable: true
      validationRegex: "^[A-Za-z0-9._-]{0,100}$"
    - name: HATCHERY_PACK_VERSION
      description: "Versão fixada do modpack: no Modrinth, o ID da versão; na CurseForge, o ID do arquivo."
      default: ""
      required: true
      userEditable: true
      validationRegex: "^[A-Za-z0-9._-]{1,64}$"
    - name: MEMORY
      description: "Heap fixa da JVM (ex.: 6G). Vazio = segue o limite de memória do container."
      default: ""
      userEditable: false
    - name: JVM_XX_OPTS
      description: "Opções extras da JVM."
      default: "-XX:MaxRAMPercentage=75"
      userEditable: false
  ports:
    - name: game
      containerPort: 25565
      protocol: TCP
      default: true
