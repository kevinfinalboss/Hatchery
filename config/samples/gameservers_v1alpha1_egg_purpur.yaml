apiVersion: gameservers.hatchery.io/v1alpha1
kind: Egg
metadata:
  labels:
    app.kubernetes.io/name: hatchery
    app.kubernetes.io/managed-by: kustomize
  name: minecraft-purpur
  namespace: hatchery-catalog
spec:
  images:
    - name: "Java 25"
      image: ghcr.io/ptero-eggs/yolks:java_25
    - name: "Java 22"
      image: ghcr.io/ptero-eggs/yolks:java_22
    - name: "Java 21"
      image: ghcr.io/ptero-eggs/yolks:java_21
    - name: "Java 17"
      image: ghcr.io/ptero-eggs/yolks:java_17
    - name: "Java 16"
      image: ghcr.io/ptero-eggs/yolks:java_16
    - name: "Java 11"
      image: ghcr.io/ptero-eggs/yolks:java_11
    - name: "Java 8"
      image: ghcr.io/ptero-eggs/yolks:java_8
  runAsUser: 1000
  startCommand: "java --add-modules=jdk.incubator.vector -XX:MaxRAMPercentage=95.0 -Dterminal.jline=false -Dterminal.ansi=true -jar {{SERVER_JARFILE}}"
  stopCommand: "stop"
  stopSignal: SIGTERM
  stopTimeoutSeconds: 90
  startupDetection:
    regex: "\\)! For help, type "
  backup:
    before: ["save-off", "save-all flush"]
    after: ["save-on"]
    savedRegex: "Saved the game"
    timeoutSeconds: 60
  install:
    image: ghcr.io/ptero-eggs/installers:alpine
    entrypoint: ["ash", "-c"]
    script: |
      #!/bin/ash
      # Purpur Installation Script
      #
      # Server Files: /data
      PROJECT=purpur

      if [ "${EULA}" = "TRUE" ]; then
        echo "eula=true" > /data/eula.txt
      fi

      if [ -n "${DL_PATH}" ]; then
        echo -e "Using supplied download url: ${DL_PATH}"
        DOWNLOAD_URL=`eval echo $(echo ${DL_PATH} | sed -e 's/{{/${/g' -e 's/}}/}/g')`
      else
        VER_EXISTS=`curl -s https://api.purpurmc.org/v2/${PROJECT} | jq -r --arg VERSION $MINECRAFT_VERSION '.versions[] | contains($VERSION)' | grep true`
        LATEST_VERSION=`curl -s https://api.purpurmc.org/v2/${PROJECT} | jq -r '.versions' | jq -r '.[-1]'`

        if [ "${VER_EXISTS}" == "true" ]; then
          echo -e "Version is valid. Using version ${MINECRAFT_VERSION}"
        else
          echo -e "Using the latest ${PROJECT} version"
          MINECRAFT_VERSION=${LATEST_VERSION}
        fi

        BUILD_EXISTS=`curl -s https://api.purpurmc.org/v2/${PROJECT}/${MINECRAFT_VERSION} | jq -r --arg BUILD ${BUILD_NUMBER} '.builds.all | tostring | contains($BUILD)' | grep true`
        LATEST_BUILD=`curl -s https://api.purpurmc.org/v2/${PROJECT}/${MINECRAFT_VERSION} | jq -r '.builds.latest'`

        if [ "${BUILD_EXISTS}" == "true" ]; then
          echo -e "Build is valid for version ${MINECRAFT_VERSION}. Using build ${BUILD_NUMBER}"
        else
          echo -e "Using the latest ${PROJECT} build for version ${MINECRAFT_VERSION}"
          BUILD_NUMBER=${LATEST_BUILD}
        fi

        echo "Version being downloaded"
        echo -e "MC Version: ${MINECRAFT_VERSION}"
        echo -e "Build: ${BUILD_NUMBER}"
        DOWNLOAD_URL=https://api.purpurmc.org/v2/${PROJECT}/${MINECRAFT_VERSION}/${BUILD_NUMBER}/download
      fi

      cd /data

      echo -e "Running curl -o ${SERVER_JARFILE} ${DOWNLOAD_URL}"

      if [ -f ${SERVER_JARFILE} ]; then
        mv ${SERVER_JARFILE} ${SERVER_JARFILE}.old
      fi

      curl -o ${SERVER_JARFILE} ${DOWNLOAD_URL}

      if [ ! -f server.properties ]; then
        echo -e "Downloading MC server.properties"
        curl -o server.properties https://raw.githubusercontent.com/ptero-eggs/game-eggs/main/minecraft/java/server.properties
      fi

      # The mod installer reads the game version actually installed from here (the variable may be "latest").
      mkdir -p /data/.hatchery
      echo "${MINECRAFT_VERSION}" > /data/.hatchery/game-version
      chown -R 1000:1000 /data
  configure:
    entrypoint: ["bash", "-c"]
    script: |
      #!/bin/bash
      # Runs on every start: forces the keys the Wings used to rewrite (config.files) without
      # touching the rest of server.properties.
      cd /data
      touch server.properties
      setkey() {
        grep -v "^$1=" server.properties > server.properties.tmp || true
        printf '%s=%s\n' "$1" "$2" >> server.properties.tmp
        mv server.properties.tmp server.properties
      }
      setkey server-ip 0.0.0.0
      setkey server-port 25565
  mods:
    kind: plugin
    loaders: [purpur, paper, spigot, bukkit]
    directory: plugins
    gameVersion:
      variable: MINECRAFT_VERSION
      file: .hatchery/game-version
  recommendedResources:
    cpu: "2"
    memory: 4Gi
    disk: 10Gi
  variables:
    - name: EULA
      description: "Aceita a EULA da Mojang (https://aka.ms/MinecraftEULA). Obrigatório pro Purpur iniciar."
      default: "TRUE"
      required: true
      userEditable: true
    - name: MINECRAFT_VERSION
      description: "Versão do Minecraft a instalar. 'latest' pega sempre a mais recente; versão inválida cai pra latest."
      default: "latest"
      userEditable: true
    - name: BUILD_NUMBER
      description: "Build do Purpur pra essa versão. 'latest' pega sempre o build mais recente; build inválido cai pro latest."
      default: "latest"
      userEditable: true
    - name: SERVER_JARFILE
      description: "Nome do arquivo .jar do servidor."
      default: "server.jar"
      userEditable: true
      validationRegex: "^([\\w\\d._-]+)(\\.jar)$"
    - name: DL_PATH
      description: "URL alternativa pra baixar o server.jar em vez da API do Purpur (avançado)."
      default: ""
      userEditable: false
  ports:
    - name: game
      containerPort: 25565
      protocol: TCP
      default: true
