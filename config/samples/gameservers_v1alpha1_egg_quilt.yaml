apiVersion: gameservers.hatchery.io/v1alpha1
kind: Egg
metadata:
  labels:
    app.kubernetes.io/name: hatchery
    app.kubernetes.io/managed-by: kustomize
  name: minecraft-quilt
  namespace: hatchery-catalog
spec:
  images:
    - name: "Java 25"
      image: ghcr.io/ptero-eggs/yolks:java_25
    - name: "Java 22"
      image: ghcr.io/ptero-eggs/yolks:java_22
    - name: "Java 21"
      image: ghcr.io/ptero-eggs/yolks:java_21
    - name: "Java 17"
      image: ghcr.io/ptero-eggs/yolks:java_17
    - name: "Java 16"
      image: ghcr.io/ptero-eggs/yolks:java_16
    - name: "Java 11"
      image: ghcr.io/ptero-eggs/yolks:java_11
    - name: "Java 8"
      image: ghcr.io/ptero-eggs/yolks:java_8
  runAsUser: 1000
  startCommand: "java -Xms128M -XX:MaxRAMPercentage=95.0 -jar {{SERVER_JARFILE}} nogui"
  stopCommand: "stop"
  stopSignal: SIGTERM
  stopTimeoutSeconds: 90
  startupDetection:
    regex: "\\)! For help, type "
  install:
    image: eclipse-temurin:21-jdk-jammy
    entrypoint: ["bash", "-c"]
    script: |
      #!/bin/bash
      # Quilt Installation Script
      #
      # Server Files: /data
      set -e
      apt-get update >/dev/null
      apt-get install -y curl jq >/dev/null
      mkdir -p /data
      cd /data

      if [ "${EULA}" = "TRUE" ]; then
        echo "eula=true" > /data/eula.txt
      fi

      if [ -z "${MC_VERSION}" ] || [ "${MC_VERSION}" = "latest" ]; then
        MC_VERSION="$(curl -fsSL https://meta.quiltmc.org/v3/versions/game | jq -r '[.[] | select(.stable == true)][0].version')"
      fi
      echo "Minecraft ${MC_VERSION}"

      curl -fsSL -o quilt.jar https://quiltmc.org/api/v1/download-latest-installer/java-universal
      rm -rf server
      java -jar quilt.jar install server "${MC_VERSION}" --download-server
      cp -r server/. /data/
      rm -rf server quilt.jar
      mv server.jar minecraft.jar
      mv quilt-server-launch.jar "${SERVER_JARFILE}"
      echo "serverJar=minecraft.jar" > quilt-server-launcher.properties

      # The mod installer reads the game version actually installed from here.
      mkdir -p /data/.hatchery
      echo "${MC_VERSION}" > /data/.hatchery/game-version
      chown -R 1000:1000 /data
      echo "Server is Ready!"
  configure:
    entrypoint: ["bash", "-c"]
    script: |
      #!/bin/bash
      # Runs on every start: forces the keys the Wings used to rewrite (config.files) without
      # touching the rest of server.properties.
      cd /data
      touch server.properties
      setkey() {
        grep -v "^$1=" server.properties > server.properties.tmp || true
        printf '%s=%s\n' "$1" "$2" >> server.properties.tmp
        mv server.properties.tmp server.properties
      }
      setkey server-ip 0.0.0.0
      setkey server-port 25565
  mods:
    kind: mod
    loaders: [quilt, fabric]
    directory: mods
    gameVersion:
      variable: MC_VERSION
      file: .hatchery/game-version
  recommendedResources:
    cpu: "2"
    memory: 4Gi
    disk: 10Gi
  variables:
    - name: EULA
      description: "Aceita a EULA da Mojang (https://aka.ms/MinecraftEULA). Obrigatório pro servidor iniciar."
      default: "TRUE"
      required: true
      userEditable: true
    - name: MC_VERSION
      description: "Versão do Minecraft. 'latest' usa a versão estável mais recente suportada pelo Quilt."
      default: "latest"
      userEditable: true
      validationRegex: "^(latest|[0-9]+(\\.[0-9]+){1,2})$"
    - name: SERVER_JARFILE
      description: "Nome do arquivo .jar do servidor."
      default: "server.jar"
      userEditable: true
      validationRegex: "^([\\w\\d._-]+)(\\.jar)$"
  ports:
    - name: game
      containerPort: 25565
      protocol: TCP
      default: true
