---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tenants.gameservers.hatchery.io
spec:
  group: gameservers.hatchery.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tenant is the Schema for the tenants API: one organization's isolated slice
          of the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantSpec defines the desired state of Tenant.
            properties:
              displayName:
                description: DisplayName is the human-readable organization name.
                type: string
              quota:
                description: Quota is the tenant's resource budget.
                properties:
                  auditRetentionDays:
                    description: |-
                      AuditRetentionDays is how long the organization's audit events are kept. Unset uses the
                      platform default (panel-api --audit-retention-days). Only the platform admin edits it.
                    format: int32
                    maximum: 3650
                    minimum: 7
                    type: integer
                  backups:
                    description: |-
                      Backups limits what the organization may keep on the platform's own backup storage. Without
                      it the platform destination is unavailable to the organization. It does not apply to a
                      destination the organization brings itself.
                    properties:
                      maxPerOrg:
                        description: MaxPerOrg is how many backups the whole organization
                          may have at the same time.
                        format: int32
                        minimum: 0
                        type: integer
                      maxPerServer:
                        description: MaxPerServer is how many backups one server may
                          have at the same time.
                        format: int32
                        minimum: 0
                        type: integer
                      retentionDays:
                        description: RetentionDays is how long a backup is kept before
                          the operator deletes it.
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - maxPerOrg
                    - maxPerServer
                    - retentionDays
                    type: object
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the total CPU requests all of the tenant's
                      pods may add up to.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  extraImageRegistries:
                    description: |-
                      ExtraImageRegistries are registries this organization may pull Egg images from on top of the
                      platform's default list (operator/panel --allowed-image-registries). Entries are matched by
                      whole path segments ("docker.io/itzg" allows docker.io/itzg/*). Only the platform admin
                      edits it. Ignored while the platform list is empty (the check is off).
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 20
                    type: array
                  maxGameServers:
                    description: MaxGameServers caps how many GameServer objects the
                      tenant may have.
                    format: int32
                    minimum: 0
                    type: integer
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the total memory requests all of the tenant's
                      pods may add up to.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storage:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Storage is the total PVC storage the tenant may request.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - cpu
                - maxGameServers
                - memory
                - storage
                type: object
            required:
            - quota
            type: object
          status:
            description: TenantStatus defines the observed state of Tenant.
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the Tenant; "Ready" is the
                  one the Panel API reads.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespace:
                description: Namespace is the namespace provisioned for this tenant.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase summarizes the tenant's lifecycle state.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'tenant name must be a DNS label of at most 32 characters and cannot
            be ''system'' or ''catalog'' (reserved: they map onto the operator and
            Egg catalog namespaces)'
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,30}[a-z0-9])?$')
            && !(self.metadata.name in ['system', 'catalog'])
    served: true
    storage: true
    subresources:
      status: {}
