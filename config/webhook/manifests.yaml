---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gameservers-hatchery-io-v1alpha1-egg
  failurePolicy: Fail
  name: vegg-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gameservers.hatchery.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - eggs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gameservers-hatchery-io-v1alpha1-gameserver
  failurePolicy: Fail
  name: vgameserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gameservers.hatchery.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gameservers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gameservers-hatchery-io-v1alpha1-gameserverrestore
  failurePolicy: Fail
  name: vgameserverrestore-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gameservers.hatchery.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - gameserverrestores
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gameservers-hatchery-io-v1alpha1-gameserverschedule
  failurePolicy: Fail
  name: vgameserverschedule-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gameservers.hatchery.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gameserverschedules
  sideEffects: None
