apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hatchery
    app.kubernetes.io/managed-by: kustomize
  name: gameserverbackup-admin-role
rules:
- apiGroups:
  - gameservers.hatchery.io
  resources:
  - gameserverbackups
  verbs:
  - '*'
- apiGroups:
  - gameservers.hatchery.io
  resources:
  - gameserverbackups/status
  verbs:
  - get
