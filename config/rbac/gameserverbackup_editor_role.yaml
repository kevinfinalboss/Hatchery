apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hatchery
    app.kubernetes.io/managed-by: kustomize
  name: gameserverbackup-editor-role
rules:
- apiGroups:
  - gameservers.hatchery.io
  resources:
  - gameserverbackups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gameservers.hatchery.io
  resources:
  - gameserverbackups/status
  verbs:
  - get
