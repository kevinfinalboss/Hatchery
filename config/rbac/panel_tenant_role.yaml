apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hatchery-panel-tenant
rules:
- apiGroups: ["gameservers.hatchery.io"]
  resources: ["gameservers", "gameserverbackups", "gameserverrestores", "gameserverschedules", "eggs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gameservers.hatchery.io"]
  resources: ["gameservers/status"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/attach", "pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
