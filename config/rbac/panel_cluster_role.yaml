apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hatchery-panel-cluster
rules:
- apiGroups: ["gameservers.hatchery.io"]
  resources: ["tenants"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gameservers.hatchery.io"]
  resources: ["eggs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get"]
