apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hatchery
    app.kubernetes.io/managed-by: kustomize
  name: egg-viewer-role
rules:
- apiGroups:
  - gameservers.hatchery.io
  resources:
  - eggs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gameservers.hatchery.io
  resources:
  - eggs/status
  verbs:
  - get
