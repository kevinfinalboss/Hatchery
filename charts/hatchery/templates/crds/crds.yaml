{{- /*
CRDs come verbatim from config/crd/bases (via `make helm-sync`). As templates (not the chart's crds/
directory) so `helm upgrade` applies schema changes; resource-policy keep so `helm uninstall` never
deletes them — and with them every GameServer, Egg and Tenant in the cluster.
*/}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") (default (dict) $crd.metadata.annotations)) }}
{{- $_ := set $crd.metadata "labels" (merge (include "hatchery.labels" $ | fromYaml) (default (dict) $crd.metadata.labels)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
