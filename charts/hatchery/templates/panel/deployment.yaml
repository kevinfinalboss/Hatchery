{{- $name := include "hatchery.panelName" . }}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.dsnSecret.name) }}
{{- fail "postgres.enabled=false needs externalDatabase.dsnSecret.name" }}
{{- end }}
{{- if and (not .Values.valkey.enabled) (not .Values.externalValkey.urlSecret.name) }}
{{- fail "valkey.enabled=false needs externalValkey.urlSecret.name" }}
{{- end }}
{{- if and .Values.backup.platform.bucket (not .Values.backup.platform.secretName) }}
{{- fail "backup.platform.bucket needs backup.platform.secretName (a Secret with access-key and secret-key)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "hatchery.componentLabels" (dict "ctx" . "component" "panel") | nindent 4 }}
spec:
  replicas: {{ .Values.panel.replicas }}
  selector:
    matchLabels: {{- include "hatchery.selector" (dict "ctx" . "component" "panel") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "hatchery.componentLabels" (dict "ctx" . "component" "panel") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "hatchery.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      {{- if or .Values.postgres.enabled .Values.valkey.enabled }}
      # The panel exits if Postgres or Valkey is unreachable at startup; waiting here keeps a fresh
      # install from sitting in CrashLoopBackOff while the databases come up. Reuses their own images.
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          command: ["sh", "-c", "until pg_isready -h {{ include "hatchery.postgresName" . }} -p 5432; do sleep 2; done"]
          securityContext: {runAsUser: 65534, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        {{- end }}
        {{- if .Values.valkey.enabled }}
        - name: wait-valkey
          image: {{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}
          command: ["sh", "-c", "until valkey-cli -h {{ include "hatchery.valkeyName" . }} -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG; do sleep 2; done"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "hatchery.valkeyName" . }}, key: password}}
          securityContext: {runAsUser: 65534, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        {{- end }}
      {{- end }}
      containers:
        - name: panel-api
          image: {{ include "hatchery.image" (dict "ctx" . "image" .Values.panel.image) }}
          imagePullPolicy: {{ .Values.panel.image.pullPolicy }}
          args:
            - --bind-address=:8090
            - --sftp-agent-image={{ include "hatchery.image" (dict "ctx" . "image" .Values.sftpAgent.image) }}
            - --admin-secret-namespace={{ .Release.Namespace }}
            - --admin-secret-name={{ .Values.panel.adminSecretName }}
            {{- with .Values.panel.allowedOrigins }}
            - --allowed-origins={{ join "," . }}
            {{- end }}
            {{- with .Values.panel.trustedProxies }}
            - --trusted-proxies={{ join "," . }}
            {{- end }}
            {{- with .Values.imagePolicy.defaultRegistries }}
            - --allowed-image-registries={{ join "," . }}
            {{- end }}
            {{- if .Values.backup.platform.bucket }}
            - --backup-s3-bucket={{ .Values.backup.platform.bucket }}
            - --backup-s3-endpoint={{ .Values.backup.platform.endpoint }}
            - --backup-s3-secret={{ .Release.Namespace }}/{{ .Values.backup.platform.secretName }}
            {{- end }}
            - --bootstrap-admin-email={{ .Values.panel.bootstrapAdmin.email }}
            {{- with .Values.panel.mods.userAgent }}
            - --mods-user-agent={{ . }}
            {{- end }}
            {{- with .Values.panel.publicURL }}
            - --public-url={{ . }}
            {{- end }}
            {{- if .Values.panel.smtp.host }}
            - --smtp-host={{ .Values.panel.smtp.host }}
            - --smtp-port={{ .Values.panel.smtp.port }}
            - --smtp-from={{ .Values.panel.smtp.from }}
            - --smtp-tls={{ .Values.panel.smtp.tls }}
            {{- end }}
          env:
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "hatchery.postgresName" . }}, key: password}}
            # The password is alphanumeric (generated by the chart), so it needs no URL escaping.
            - name: POSTGRES_DSN
              value: postgres://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@{{ include "hatchery.postgresName" . }}:5432/{{ .Values.postgres.database }}?sslmode=disable
            {{- else }}
            - name: POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: {{ .Values.externalDatabase.dsnSecret.name }}, key: {{ .Values.externalDatabase.dsnSecret.key }}}}
            {{- end }}
            {{- if .Values.valkey.enabled }}
            - name: VALKEY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "hatchery.valkeyName" . }}, key: password}}
            - name: PANEL_REDIS_URL
              value: redis://:$(VALKEY_PASSWORD)@{{ include "hatchery.valkeyName" . }}:6379/0
            {{- else }}
            - name: PANEL_REDIS_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.externalValkey.urlSecret.name }}, key: {{ .Values.externalValkey.urlSecret.key }}}}
            {{- end }}
            {{- with .Values.panel.smtp.existingSecret }}
            - name: PANEL_SMTP_USERNAME
              valueFrom: {secretKeyRef: {name: {{ . }}, key: username}}
            - name: PANEL_SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ . }}, key: password}}
            {{- end }}
            {{- with .Values.panel.mods.curseforge.existingSecret }}
            - name: PANEL_CURSEFORGE_API_KEY
              valueFrom: {secretKeyRef: {name: {{ . }}, key: api-key}}
            {{- end }}
          ports:
            - {name: http, containerPort: 8090, protocol: TCP}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.panel.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            # Large uploads (mods) spill from memory to a temp file (mime/multipart).
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.panel.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.panel.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.panel.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "hatchery.componentLabels" (dict "ctx" . "component" "panel") | nindent 4 }}
spec:
  type: {{ .Values.panel.service.type }}
  selector: {{- include "hatchery.selector" (dict "ctx" . "component" "panel") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.panel.service.port }}
      targetPort: http
