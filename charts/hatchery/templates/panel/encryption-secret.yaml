{{- /*
The panel's encryption key (TOTP secrets at rest). Generated once and reused on every upgrade; kept on
uninstall. Losing it makes every stored TOTP secret unreadable: keep a copy outside the cluster.
*/ -}}
{{- if not .Values.panel.encryption.existingSecret }}
{{- $name := printf "%s-encryption" (include "hatchery.panelName" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "hatchery.componentLabels" (dict "ctx" . "component" "panel") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "key") }}
  key: {{ index $existing.data "key" }}
  {{- else }}
  {{- /* randBytes returns 32 random bytes already in base64: that string is the key. */}}
  key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
