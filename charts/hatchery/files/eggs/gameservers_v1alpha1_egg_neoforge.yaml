apiVersion: gameservers.hatchery.io/v1alpha1
kind: Egg
metadata:
  labels:
    app.kubernetes.io/name: hatchery
    app.kubernetes.io/managed-by: kustomize
  name: minecraft-neoforge
  namespace: hatchery-catalog
spec:
  images:
    - name: "Java 25"
      image: ghcr.io/ptero-eggs/yolks:java_25
    - name: "Java 22"
      image: ghcr.io/ptero-eggs/yolks:java_22
    - name: "Java 21"
      image: ghcr.io/ptero-eggs/yolks:java_21
    - name: "Java 17"
      image: ghcr.io/ptero-eggs/yolks:java_17
  runAsUser: 1000
  startCommand: "java -Xms128M -XX:MaxRAMPercentage=95.0 -Dterminal.jline=false -Dterminal.ansi=true @unix_args.txt nogui"
  stopCommand: "stop"
  stopSignal: SIGTERM
  stopTimeoutSeconds: 90
  startupDetection:
    regex: "\\)! For help, type "
  backup:
    before: ["save-off", "save-all flush"]
    after: ["save-on"]
    savedRegex: "Saved the game"
    timeoutSeconds: 60
  install:
    image: eclipse-temurin:25-jdk-noble
    entrypoint: ["bash", "-c"]
    script: |
      #!/bin/bash
      # NeoForge Installation Script
      #
      # Server Files: /data
      set -e
      apt-get update >/dev/null
      apt-get install -y curl jq >/dev/null
      cd /data

      if [ "${EULA}" = "TRUE" ]; then
        echo "eula=true" > /data/eula.txt
      fi

      NEOFORGE_VERSION="$(echo "${NEOFORGE_VERSION}" | tr -d ' ')"
      MC_VERSION="$(echo "${MC_VERSION}" | tr -d ' ')"
      API=https://maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge

      if [ -z "${NEOFORGE_VERSION}" ]; then
        VERSIONS="$(curl -fsSL "${API}" | jq -r '.versions[]' | grep -v craftmine)"
        if [ -z "${MC_VERSION}" ] || [ "${MC_VERSION}" = "latest" ]; then
          NEOFORGE_VERSION="$(echo "${VERSIONS}" | grep -vE 'beta|alpha' | tail -n1)"
        else
          # 1.21.4 -> "21.4."   1.21 -> "21.0."   26.1.2 -> "26.1.2."   26.3 -> "26.3.0."
          case "${MC_VERSION}" in
            1.*.*) PREFIX="${MC_VERSION#1.}." ;;
            1.*)   PREFIX="${MC_VERSION#1.}.0." ;;
            *.*.*) PREFIX="${MC_VERSION}." ;;
            *)     PREFIX="${MC_VERSION}.0." ;;
          esac
          CANDIDATES="$(echo "${VERSIONS}" | awk -v p="${PREFIX}" 'index($0, p) == 1')"
          NEOFORGE_VERSION="$(echo "${CANDIDATES}" | grep -vE 'beta|alpha' | tail -n1 || true)"
          if [ -z "${NEOFORGE_VERSION}" ]; then
            NEOFORGE_VERSION="$(echo "${CANDIDATES}" | tail -n1)"
            [ -n "${NEOFORGE_VERSION}" ] && echo "No stable NeoForge for ${MC_VERSION}, using beta ${NEOFORGE_VERSION}"
          fi
        fi
      fi
      if [ -z "${NEOFORGE_VERSION}" ]; then
        echo "No NeoForge version found for Minecraft ${MC_VERSION}."
        exit 1
      fi

      # The Minecraft version this NeoForge targets: 21.4.157 -> 1.21.4, 21.0.x -> 1.21,
      # 26.2.0.88 -> 26.2, 26.1.2.109 -> 26.1.2.
      IFS=. read -r A B C _ <<< "${NEOFORGE_VERSION%%-*}"
      if [ "${A}" -ge 26 ]; then
        if [ "${C}" != "0" ]; then MC_RESOLVED="${A}.${B}.${C}"; else MC_RESOLVED="${A}.${B}"; fi
      else
        if [ "${B}" = "0" ]; then MC_RESOLVED="1.${A}"; else MC_RESOLVED="1.${A}.${B}"; fi
      fi
      echo "NeoForge ${NEOFORGE_VERSION} (Minecraft ${MC_RESOLVED})"

      INSTALLER="neoforge-${NEOFORGE_VERSION}-installer.jar"
      curl -fsSL -o "${INSTALLER}" "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/${INSTALLER}"

      # Clean a previous install (upgrade/downgrade).
      rm -rf libraries/net/neoforged/neoforge
      java -jar "${INSTALLER}" --installServer
      rm -f "${INSTALLER}" "${INSTALLER}.log" run.bat run.sh

      ln -sf "libraries/net/neoforged/neoforge/${NEOFORGE_VERSION}/unix_args.txt" unix_args.txt
      if [ ! -f unix_args.txt ]; then
        echo "Installer did not generate unix_args.txt. Installation failed."
        exit 1
      fi

      # The mod installer reads the game version actually installed from here.
      mkdir -p /data/.hatchery
      echo "${MC_RESOLVED}" > /data/.hatchery/game-version
      chown -R 1000:1000 /data
      echo "Installation complete."
  configure:
    entrypoint: ["bash", "-c"]
    script: |
      #!/bin/bash
      # Runs on every start: forces the keys the Wings used to rewrite (config.files) without
      # touching the rest of server.properties.
      cd /data
      touch server.properties
      setkey() {
        grep -v "^$1=" server.properties > server.properties.tmp || true
        printf '%s=%s\n' "$1" "$2" >> server.properties.tmp
        mv server.properties.tmp server.properties
      }
      setkey server-ip 0.0.0.0
      setkey server-port 25565
  mods:
    kind: mod
    loaders: [neoforge]
    directory: mods
    gameVersion:
      variable: MC_VERSION
      file: .hatchery/game-version
  recommendedResources:
    cpu: "2"
    memory: 4Gi
    disk: 10Gi
  variables:
    - name: EULA
      description: "Aceita a EULA da Mojang (https://aka.ms/MinecraftEULA). Obrigatório pro servidor iniciar."
      default: "TRUE"
      required: true
      userEditable: true
    - name: MC_VERSION
      description: "Versão do Minecraft. 'latest' usa a versão estável mais recente do NeoForge; uma versão sem NeoForge estável usa a beta mais nova."
      default: "latest"
      userEditable: true
      validationRegex: "^(latest|[0-9]+(\\.[0-9]+){1,2})$"
    - name: NEOFORGE_VERSION
      description: "Versão exata do NeoForge (ex.: 21.4.157). Vazio = escolhida pela versão do Minecraft."
      default: ""
      userEditable: true
      validationRegex: "^[0-9A-Za-z.+-]*$"
  ports:
    - name: game
      containerPort: 25565
      protocol: TCP
      default: true
