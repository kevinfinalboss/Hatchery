---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gameserverschedules.gameservers.hatchery.io
spec:
  group: gameservers.hatchery.io
  names:
    kind: GameServerSchedule
    listKind: GameServerScheduleList
    plural: gameserverschedules
    singular: gameserverschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gameServerRef.name
      name: Server
      type: string
    - jsonPath: .spec.cron
      name: Cron
      type: string
    - jsonPath: .status.nextScheduleTime
      name: Next
      type: date
    - jsonPath: .status.lastRun.result
      name: Last
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GameServerSchedule runs a list of tasks against one GameServer
          on a cron schedule.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GameServerSchedule
            properties:
              cron:
                description: Cron is a standard 5-field expression (minute hour day-of-month
                  month day-of-week).
                type: string
              displayName:
                maxLength: 64
                type: string
              gameServerRef:
                description: GameServerRef names the GameServer this schedule acts
                  on. Immutable after creation.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: gameServerRef is immutable
                  rule: self == oldSelf
              onlyWhenRunning:
                default: true
                description: OnlyWhenRunning skips the whole run while the server
                  is not Running.
                type: boolean
              suspend:
                type: boolean
              tasks:
                items:
                  description: ScheduleTask is one step of a schedule run. Tasks run
                    in order; DelaySeconds is waited before it.
                  properties:
                    action:
                      description: ScheduleAction is what one task of a schedule does.
                      enum:
                      - Command
                      - Restart
                      - Start
                      - Stop
                      - Backup
                      type: string
                    command:
                      description: Command is written to the game's console. Only
                        for action Command.
                      maxLength: 512
                      type: string
                    delaySeconds:
                      format: int32
                      maximum: 900
                      minimum: 0
                      type: integer
                    keepLast:
                      description: |-
                        KeepLast keeps only the newest N completed backups this schedule made (0 keeps all). Only
                        for action Backup; manual backups are never rotated.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - action
                  type: object
                maxItems: 10
                minItems: 1
                type: array
              timeZone:
                description: TimeZone is an IANA name (e.g. America/Sao_Paulo). Empty
                  means UTC.
                type: string
            required:
            - cron
            - gameServerRef
            - tasks
            type: object
          status:
            description: status defines the observed state of GameServerSchedule
            properties:
              activeRun:
                description: |-
                  ActiveScheduleRun is a run in progress. Kept in status so an operator restart resumes it at
                  TaskIndex instead of repeating earlier tasks.
                properties:
                  id:
                    description: |-
                      ID identifies the run (its start time, RFC3339); backups it creates carry it so a retried
                      Backup task never creates a second one.
                    type: string
                  nextTaskAt:
                    format: date-time
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  taskIndex:
                    format: int32
                    type: integer
                required:
                - id
                - nextTaskAt
                - startedAt
                - taskIndex
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRun:
                description: ScheduleRun records the outcome of the most recent schedule
                  run.
                properties:
                  finishedAt:
                    format: date-time
                    type: string
                  message:
                    type: string
                  result:
                    description: ScheduleRunResult summarizes how a schedule run ended.
                    enum:
                    - Succeeded
                    - Failed
                    - Skipped
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                required:
                - result
                - startedAt
                type: object
              lastRunNow:
                description: LastRunNow is the RunNowAnnotation value already acted
                  on (one manual run per value).
                type: string
              lastScheduleTime:
                format: date-time
                type: string
              nextScheduleTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
